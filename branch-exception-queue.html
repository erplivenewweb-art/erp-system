<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/auth-guard.js"></script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Branch Exception Queue</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="icons/icon-192.png"><script src="js/pwa.js" defer></script><link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/toast.css"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>.panel{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:18px;box-shadow:0 10px 24px rgba(15,23,42,.06);margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:12px;align-items:end}.field label{display:block;font-size:11px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #e3d7c7;border-radius:12px;padding:11px;background:#fffdf8}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(180deg,#d9ae67,#bb8134);color:#fff}.dark{background:#172033;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:14px;vertical-align:top}.table th{background:#f8fafc;color:#475569;font-size:11px;text-transform:uppercase}.wrap{overflow-x:auto;border:1px solid #edf2f7;border-radius:14px}.badge{border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900;background:#eef2ff;color:#3730a3}.CRITICAL{background:#fff1f1;color:#b42318}.HIGH{background:#fff7ed;color:#9a3412}.MEDIUM{background:#fffbe6;color:#854d0e}.LOW{background:#ecfbf3;color:#166534}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:16px;padding:18px}@media(max-width:1100px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.filters{grid-template-columns:1fr}}</style>
</head>
<body><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidebar-inner"><div class="brand"><a href="settings.html" class="sidebar-settings-btn" data-page-key="settings"><i class="fas fa-gear"></i></a><h2>ERP PANEL</h2><p>Store Mode</p></div><ul class="menu"></ul></div></aside><main class="main">
<div class="topbar"><div class="top-left"><button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button><div class="title"><h1>Exception Queue</h1><p>Barcode-level branch audit exceptions and approvals</p></div></div><div class="top-right"><button onclick="loadExceptions(true)">Refresh</button><button onclick="logoutUser()">Logout</button></div></div>
<section class="page active"><div class="panel"><div class="filters"><div class="field"><label>Branch</label><select id="branchId"><option value="">All</option></select></div><div class="field"><label>Status</label><select id="status"><option value="OPEN">Open</option><option value="">All</option><option>APPROVED</option></select></div><div class="field"><label>Severity</label><select id="severity"><option value="">All</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select></div><div class="field"><label>Type</label><select id="exceptionType"><option value="">All</option><option>DUPLICATE_BARCODE</option><option>WRONG_BRANCH</option><option>IN_TRANSIT_TOO_LONG</option><option>SHORTAGE_UNRESOLVED</option><option>SOLD_BUT_IN_STOCK</option><option>STOCK_STATE_MISMATCH</option><option>MISSING_FROM_BRANCH</option></select></div><div class="field"><label>Barcode</label><input id="barcode"></div><button class="btn primary" onclick="loadExceptions(true)">Apply</button><button class="btn dark" onclick="exportCsv()">CSV Export</button></div></div><div class="panel"><h3><i class="fas fa-list-check"></i> Exceptions</h3><div class="wrap"><table class="table"><thead><tr><th>Severity</th><th>Type</th><th>Barcode</th><th>Branch</th><th>Expected</th><th>Actual</th><th>Issue</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></div></section>
</main></div><div id="modal" class="modal-backdrop" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h3>Approve Exception</h3><p id="target"></p><div class="field"><label>Resolution Note</label><textarea id="resolutionNote" rows="4"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitApproval()">Approve</button></div></div></div>
<script src="js/auth.js"></script><script>
let currentExceptions=[],canApprove=false,pendingId=null;function api(p,o={}){return fetch(p,{credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json",...(o.headers||{})},...o}).then(r=>r.json().then(d=>{if(!r.ok||d.success===false)throw new Error(d.message||"Request failed");return d;}))}function toast(m,t="info"){window.showToast?showToast(m,t):alert(m)}function qs(){const p=new URLSearchParams({limit:"300"});if(branchId.value)p.set("branchId",branchId.value);if(status.value)p.set("status",status.value);if(severity.value)p.set("severity",severity.value);if(exceptionType.value)p.set("exceptionType",exceptionType.value);if(barcode.value.trim())p.set("barcode",barcode.value.trim());return p.toString()}function badge(s){return `<span class="badge ${s}">${s||"-"}</span>`}async function loadBranches(){try{const d=await api("/branches");branchId.innerHTML='<option value="">All</option>'+(d.branches||[]).map(b=>`<option value="${b.id}">${b.branch_name} (${b.branch_code})</option>`).join("")}catch(e){}}async function loadExceptions(s=false){try{const d=await api(`/branch-audit/exceptions?${qs()}`);currentExceptions=d.exceptions||[];canApprove=!!d.canApprove;rows.innerHTML=currentExceptions.length?currentExceptions.map(e=>`<tr><td>${badge(e.severity)}</td><td>${e.exception_type}</td><td><strong>${e.barcode||"-"}</strong><br>${e.run_no||""}</td><td>${e.branch_name||e.branch_id||"-"}</td><td>${e.expected_branch_id||"-"} / ${e.expected_state||"-"}</td><td>${e.actual_branch_id||"-"} / ${e.actual_state||"-"}</td><td>${e.description||""}</td><td>${canApprove&&e.status==="OPEN"?`<button class="btn primary" onclick="openApprove(${e.id})">Approve</button>`:e.status}</td></tr>`).join(""):`<tr><td colspan="8">No exceptions</td></tr>`;if(s)toast("Exceptions refreshed","success")}catch(e){toast(e.message,"error")}}function openApprove(id){pendingId=id;const ex=currentExceptions.find(x=>Number(x.id)===Number(id));target.textContent=ex?`${ex.exception_type} - ${ex.barcode||"-"}`:"";resolutionNote.value="";modal.classList.add("open")}async function submitApproval(){try{if(!resolutionNote.value.trim()){toast("Resolution note is required","error");return}await api(`/branch-audit/exceptions/${pendingId}/approve`,{method:"POST",body:JSON.stringify({resolution_note:resolutionNote.value.trim()})});toast("Exception approved","success");closeModal();loadExceptions()}catch(e){toast(e.message,"error")}}function exportCsv(){const lines=[["Severity","Type","Barcode","Branch","Expected Branch","Actual Branch","Expected State","Actual State","Description","Status"],...currentExceptions.map(e=>[e.severity,e.exception_type,e.barcode,e.branch_name||e.branch_id,e.expected_branch_id,e.actual_branch_id,e.expected_state,e.actual_state,e.description,e.status])];const csv=lines.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="branch-exception-queue.csv";a.click();URL.revokeObjectURL(a.href)}function closeModal(e){if(e&&e.target!==modal)return;modal.classList.remove("open");pendingId=null}function toggleSidebar(){sidebar?.classList.toggle("collapsed")}function logoutUser(){if(window.clearAuthSession)clearAuthSession();location.href="login.html"}addEventListener("DOMContentLoaded",()=>{loadBranches();loadExceptions()});
</script><script src="js/toast.js"></script><script src="js/help-guide.js"></script></body></html>
