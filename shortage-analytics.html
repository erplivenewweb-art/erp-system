<!DOCTYPE html><html lang="en"><head><script src="js/auth-guard.js"></script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Shortage Analytics</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="icons/icon-192.png"><script src="js/pwa.js" defer></script><link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/toast.css"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>.panel{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:18px;box-shadow:0 10px 24px rgba(15,23,42,.06);margin-bottom:18px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#fffaf2;border:1px solid #eadfce;border-radius:12px;padding:14px}.metric span{font-size:11px;color:#64748b;font-weight:900;text-transform:uppercase}.metric strong{display:block;font-size:24px}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:14px;vertical-align:top}.data-table th{background:#f8fafc;color:#475569;font-size:11px;text-transform:uppercase}.table-wrap{overflow-x:auto;border:1px solid #edf2f7;border-radius:14px}.pill{display:inline-flex;margin:2px;border-radius:999px;padding:5px 8px;background:#fff1f1;color:#991b1b;font-weight:800;font-size:12px}@media(max-width:760px){.metric-grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidebar-inner"><div class="brand"><a href="settings.html" class="sidebar-settings-btn" data-page-key="settings"><i class="fas fa-gear"></i></a><h2>ERP PANEL</h2><p>Store Mode</p></div><ul class="menu"></ul></div></aside><main class="main"><div class="topbar"><div class="top-left"><button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button><div class="title"><h1>Shortage Analytics</h1><p>Mismatch transfers, missing barcode counts, and shortage age</p></div></div><div class="top-right"><button onclick="loadReport(true)">Refresh</button><button onclick="logoutUser()">Logout</button></div></div><section class="page active"><div class="panel"><div class="metric-grid"><div class="metric"><span>Shortage Transfers</span><strong id="transferCount">0</strong></div><div class="metric"><span>Missing Barcodes</span><strong id="missingCount">0</strong></div><div class="metric"><span>Critical Age</span><strong id="criticalCount">0</strong></div></div></div><div class="panel"><h3><i class="fas fa-circle-exclamation"></i> Mismatch Table</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Transfer</th><th>Route</th><th>Missing</th><th>Age</th><th>Barcodes</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div></section></main></div><script src="js/auth.js"></script><script>function api(p){return fetch(p,{credentials:"include",cache:"no-store"}).then(r=>r.json().then(d=>{if(!r.ok||d.success===false)throw new Error(d.message||"Request failed");return d;}))}function toast(m,t="info"){window.showToast?showToast(m,t):alert(m)}async function loadReport(s=false){try{const d=await api("/branch-analytics/shortages");const list=d.shortages||[];transferCount.textContent=list.length;missingCount.textContent=list.reduce((a,b)=>a+Number(b.missing_count||0),0);criticalCount.textContent=list.filter(x=>Number(x.shortage_age_hours||0)>=72).length;rows.innerHTML=list.length?list.map(x=>`<tr><td><strong>${x.transfer_no}</strong><br>${x.status}</td><td>${x.from_branch_name||"-"} to ${x.to_branch_name||"-"}</td><td>${x.missing_count}</td><td>${Number(x.shortage_age_hours||0)} hrs</td><td>${(x.missing_barcodes||[]).map(b=>`<span class="pill">${b}</span>`).join("")||"-"}</td></tr>`).join(""):`<tr><td colspan="5">No shortages found</td></tr>`;if(s)toast("Shortage analytics refreshed","success")}catch(e){toast(e.message,"error")}}function toggleSidebar(){sidebar?.classList.toggle("collapsed")}function logoutUser(){if(window.clearAuthSession)clearAuthSession();location.href="login.html"}addEventListener("DOMContentLoaded",loadReport)</script><script src="js/toast.js"></script><script src="js/help-guide.js"></script></body></html>
