<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/auth-guard.js"></script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Branch Stock Snapshots</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="icons/icon-192.png"><script src="js/pwa.js" defer></script><link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/toast.css"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>.panel{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:18px;box-shadow:0 10px 24px rgba(15,23,42,.06);margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px;align-items:end}.field label{display:block;font-size:11px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #e3d7c7;border-radius:12px;padding:11px;background:#fffdf8}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(180deg,#d9ae67,#bb8134);color:#fff}.dark{background:#172033;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:14px}.table th{background:#f8fafc;color:#475569;font-size:11px;text-transform:uppercase}.wrap{overflow-x:auto;border:1px solid #edf2f7;border-radius:14px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-backdrop.open{display:flex}.modal{width:min(980px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.filters{grid-template-columns:1fr}}</style>
</head>
<body><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidebar-inner"><div class="brand"><a href="settings.html" class="sidebar-settings-btn" data-page-key="settings"><i class="fas fa-gear"></i></a><h2>ERP PANEL</h2><p>Store Mode</p></div><ul class="menu"></ul></div></aside><main class="main">
  <div class="topbar"><div class="top-left"><button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button><div class="title"><h1>Stock Snapshots</h1><p>Daily branch stock snapshot history and item export</p></div></div><div class="top-right"><button onclick="loadSnapshots(true)">Refresh</button><button onclick="logoutUser()">Logout</button></div></div>
  <section class="page active"><div class="panel"><div class="filters"><div class="field"><label>Branch</label><select id="branchId"><option value="">All branches</option></select></div><div class="field"><label>From</label><input type="date" id="fromDate"></div><div class="field"><label>To</label><input type="date" id="toDate"></div><button class="btn primary" onclick="loadSnapshots(true)">Apply</button><button class="btn dark" onclick="createSnapshot()">Create Snapshot</button></div></div><div class="panel"><h3><i class="fas fa-camera-retro"></i> Snapshot List</h3><div class="wrap"><table class="table"><thead><tr><th>Date</th><th>Branch</th><th>Total</th><th>In Stock</th><th>Transit</th><th>Shortage</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading...</td></tr></tbody></table></div></div></section>
</main></div><div id="modal" class="modal-backdrop" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;gap:12px"><h3 id="modalTitle">Snapshot</h3><div><button class="btn dark" onclick="exportCsv()">CSV Export</button> <button class="btn" onclick="closeModal()">Close</button></div></div><div class="wrap"><table class="table"><thead><tr><th>Barcode</th><th>Product</th><th>Lot</th><th>Weight</th><th>Status</th><th>State</th></tr></thead><tbody id="itemRows"></tbody></table></div></div></div>
<script src="js/auth.js"></script><script>
let currentItems=[];function api(p,o={}){return fetch(p,{credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json",...(o.headers||{})},...o}).then(r=>r.json().then(d=>{if(!r.ok||d.success===false)throw new Error(d.message||"Request failed");return d;}))}function toast(m,t="info"){window.showToast?showToast(m,t):alert(m)}function qs(){const p=new URLSearchParams({limit:"200"});if(branchId.value)p.set("branchId",branchId.value);if(fromDate.value)p.set("fromDate",fromDate.value);if(toDate.value)p.set("toDate",toDate.value);return p.toString()}async function loadBranches(){try{const d=await api("/branches");branchId.innerHTML='<option value="">All branches</option>'+(d.branches||[]).map(b=>`<option value="${b.id}">${b.branch_name} (${b.branch_code})</option>`).join("")}catch(e){}}async function loadSnapshots(s=false){try{const d=await api(`/branch-audit/snapshots?${qs()}`);rows.innerHTML=(d.snapshots||[]).length?d.snapshots.map(x=>`<tr><td>${String(x.snapshot_date||"").slice(0,10)}</td><td>${x.branch_name||"-"}</td><td>${x.total_items||0}</td><td>${x.in_stock_items||0}</td><td>${x.in_transit_items||0}</td><td>${x.shortage_items||0}</td><td><button class="btn primary" onclick="openSnapshot(${x.id})">View</button></td></tr>`).join(""):`<tr><td colspan="7">No snapshots</td></tr>`;if(s)toast("Snapshots refreshed","success")}catch(e){toast(e.message,"error")}}async function createSnapshot(){try{await api("/branch-audit/snapshot",{method:"POST",body:JSON.stringify({branchId:branchId.value||undefined})});toast("Snapshot created/refreshed","success");loadSnapshots()}catch(e){toast(e.message,"error")}}async function openSnapshot(id){try{const d=await api(`/branch-audit/snapshots/${id}?limit=500`);currentItems=d.items||[];modalTitle.textContent=`Snapshot ${String(d.snapshot.snapshot_date||"").slice(0,10)} - ${d.snapshot.branch_name||""}`;itemRows.innerHTML=currentItems.length?currentItems.map(i=>`<tr><td>${i.barcode||""}</td><td>${i.product_name||""}</td><td>${i.lot_number||""}</td><td>${Number(i.weight||0).toFixed(3)}</td><td>${i.status||""}</td><td>${i.stock_state||""}</td></tr>`).join(""):`<tr><td colspan="6">No items</td></tr>`;modal.classList.add("open")}catch(e){toast(e.message,"error")}}function exportCsv(){const lines=[["Barcode","Product","Lot","Weight","Status","State"],...currentItems.map(i=>[i.barcode,i.product_name,i.lot_number,i.weight,i.status,i.stock_state])];const csv=lines.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="branch-snapshot-items.csv";a.click();URL.revokeObjectURL(a.href)}function closeModal(e){if(e&&e.target!==modal)return;modal.classList.remove("open")}function toggleSidebar(){sidebar?.classList.toggle("collapsed")}function logoutUser(){if(window.clearAuthSession)clearAuthSession();location.href="login.html"}addEventListener("DOMContentLoaded",()=>{loadBranches();loadSnapshots()});
</script><script src="js/toast.js"></script><script src="js/help-guide.js"></script></body></html>
