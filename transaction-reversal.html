<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Reversal</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/toast.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pill{display:inline-block;border:1px solid #cbd5e1;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.danger{background:#fee2e2;color:#991b1b;border-color:#fecaca}@media(max-width:800px){.grid,.summary{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"><div class="sidebar-inner"><div class="brand"><h2>ERP PANEL</h2><p>Jewellery Management</p></div><ul class="menu">
      <li><a href="transaction.html"><i class="fas fa-arrow-right-arrow-left"></i> Transaction</a></li>
      <li><a href="transaction-reversal.html" class="active"><i class="fas fa-rotate-left"></i> Transaction Reversal</a></li>
      <li><a href="payment-accounts.html"><i class="fas fa-wallet"></i> Payment Accounts</a></li>
      <li><a href="account-ledger.html"><i class="fas fa-book"></i> Account Ledger</a></li>
      <li><a href="daily-closing.html"><i class="fas fa-lock"></i> Daily Closing</a></li>
    </ul></div></aside>
    <main class="main">
      <div class="topbar"><div class="top-left"><button class="hamburger" type="button" onclick="toggleSidebar()"><span></span><span></span><span></span></button><div class="title"><h1>Transaction Reversal</h1><p>Controlled compensating reversal workflow</p></div></div><div class="top-right"><div class="profile-box" id="profileBox"></div></div></div>
      <section class="page active"><div class="section-box">
        <div class="grid">
          <div class="panel">
            <h3>Search Transaction</h3>
            <div class="input-box"><label>Voucher, invoice, reference, or ID</label><input id="searchText" /></div>
            <button class="primary-btn" type="button" onclick="searchTransactions()">Search</button>
            <div class="table-wrap"><table><thead><tr><th>ID</th><th>Voucher</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody id="searchBody"></tbody></table></div>
          </div>
          <div class="panel">
            <h3>Reversal Preview</h3>
            <div id="detailBox">Select a transaction.</div>
            <div class="input-box"><label>Reason</label><textarea id="reason" rows="4"></textarea></div>
            <button class="primary-btn danger" type="button" onclick="reverseTransaction()">Reverse Transaction</button>
          </div>
        </div>
      </div></section>
    </main>
  </div>
  <script>
    const API_BASE=window.ERP_API_BASE;let selectedId=null;
    function user(){try{return JSON.parse(localStorage.getItem("erpLoggedInUser"))||null}catch(_){return null}}
    function uid(){const n=Number(user()?.id||user()?.user_id||0);return Number.isFinite(n)&&n>0?n:null}
    function cid(){const n=Number((typeof getEffectiveCompanyId==="function"?getEffectiveCompanyId():user()?.company_id)||0);return Number.isFinite(n)&&n>0?n:null}
    function isSuperAdmin(){const u=user();return String(u?.role||"").toLowerCase()==="superadmin"}
    function params(){const p=new URLSearchParams();if(uid())p.set("actingUserId",uid());if(cid()||isSuperAdmin())p.set("companyId",cid());return p}
    function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
    function money(v){return `Rs ${Number(v||0).toFixed(2)}`}
    async function fetchJson(url,opt){const r=await fetch(url,{cache:"no-store",credentials:"include",headers:{"Content-Type":"application/json"},...(opt||{})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Request failed");return d}
    async function searchTransactions(){try{const p=params();if(searchText.value.trim())p.set("search",searchText.value.trim());const d=await fetchJson(`${API_BASE}/transaction/reversal/search?${p}`);searchBody.innerHTML=(d.rows||[]).map(r=>`<tr><td>${r.id}</td><td>${esc(r.voucher_no)}</td><td>${esc(r.transaction_type)}</td><td>${esc(r.status)}${r.reversal_transaction_id?" / reversed":""}</td><td><button type="button" onclick="preview(${Number(r.id)})">View</button></td></tr>`).join("")||'<tr><td colspan="5">No transactions</td></tr>'}catch(e){showToast(e.message,"error")}}
    async function preview(id){try{selectedId=id;const p=params();p.set("transactionId",id);const d=await fetchJson(`${API_BASE}/transaction/reversal/preview?${p}`);const t=d.transaction||{};detailBox.innerHTML=`<p><span class="pill">${esc(t.transaction_type)}</span> <span class="pill">${esc(d.reversalType||"")}</span></p><div class="summary"><div><b>Voucher</b><br>${esc(t.voucher_no)}</div><div><b>Party</b><br>${esc(t.party_name)}</div><div><b>Invoice</b><br>${esc(t.invoice_no)}</div></div><h4>Cash impact</h4>${(d.cashPreview||[]).map(x=>`<p>${esc(x.account_name||"Account")} debit ${money(x.reversal_debit)} credit ${money(x.reversal_credit)}</p>`).join("")||"<p>No cash impact</p>"}<h4>Blocks</h4>${(d.blockedReasons||[]).map(x=>`<p class="pill danger">${esc(x)}</p>`).join("")||"<p>Ready</p>"}`}catch(e){showToast(e.message,"error")}}
    async function reverseTransaction(){try{if(!selectedId)throw new Error("Select a transaction first");if(!reason.value.trim())throw new Error("Reason is required");await fetchJson(`${API_BASE}/transaction/reversal?${params()}`,{method:"POST",body:JSON.stringify({transactionId:selectedId,reason:reason.value.trim()})});showToast("Transaction reversed","success");reason.value="";await preview(selectedId)}catch(e){showToast(e.message,"error")}}
    function toggleSidebar(){document.getElementById("sidebar")?.classList.toggle("collapsed")}
    window.addEventListener("load",()=>{profileBox.textContent=user()?.name||user()?.email||"User";searchTransactions()});
  </script>
  <script src="js/auth.js"></script>
  <script>requireLogin();requirePageAccess("transaction-reversal");filterSidebarMenuByRole();</script>
  <script src="js/toast.js"></script>
</body>
</html>
