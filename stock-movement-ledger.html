<!DOCTYPE html><html lang="en"><head><script src="js/auth-guard.js"></script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Stock Movement Ledger</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="icons/icon-192.png"><script src="js/pwa.js" defer></script><link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/toast.css"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>.panel{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:18px;box-shadow:0 10px 24px rgba(15,23,42,.06);margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px;align-items:end}.field label{display:block;font-size:11px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #e3d7c7;border-radius:12px;padding:11px;background:#fffdf8}.btn{border:0;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:900}.primary{background:linear-gradient(180deg,#d9ae67,#bb8134);color:#fff}.timeline{display:grid;gap:10px}.move{border:1px solid #edf2f7;border-left:4px solid #c58b2b;border-radius:12px;padding:12px;background:#fffdf8}.badge{border-radius:999px;padding:5px 8px;font-weight:900;font-size:12px;background:#eef2ff;color:#3730a3}.muted{color:#64748b;font-size:13px}@media(max-width:980px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.filters{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidebar-inner"><div class="brand"><a href="settings.html" class="sidebar-settings-btn" data-page-key="settings"><i class="fas fa-gear"></i></a><h2>ERP PANEL</h2><p>Store Mode</p></div><ul class="menu"></ul></div></aside><main class="main"><div class="topbar"><div class="top-left"><button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button><div class="title"><h1>Movement Ledger</h1><p>Barcode timeline across stock, transfers, sales, returns, and shortages</p></div></div><div class="top-right"><button onclick="loadLedger(true)">Refresh</button><button onclick="logoutUser()">Logout</button></div></div><section class="page active"><div class="panel"><div class="filters"><div class="field"><label>Barcode</label><input id="barcode" placeholder="Search barcode"></div><div class="field"><label>Movement</label><select id="movement"><option value="">All</option><option>CREATED</option><option>TRANSFER_CREATED</option><option>DISPATCHED</option><option>RECEIVED</option><option>SOLD</option><option>RETURNED</option><option>DAMAGED</option><option>SHORTAGE</option></select></div><div class="field"><label>From</label><input type="date" id="fromDate"></div><div class="field"><label>To</label><input type="date" id="toDate"></div><button class="btn primary" onclick="loadLedger(true)">Apply</button></div></div><div class="panel"><h3><i class="fas fa-timeline"></i> Timeline</h3><div id="rows" class="timeline"><div class="muted">Loading...</div></div></div></section></main></div><script src="js/auth.js"></script><script>function api(p){return fetch(p,{credentials:"include",cache:"no-store"}).then(r=>r.json().then(d=>{if(!r.ok||d.success===false)throw new Error(d.message||"Request failed");return d;}))}function toast(m,t="info"){window.showToast?showToast(m,t):alert(m)}function qs(){const p=new URLSearchParams({limit:"200"});if(barcode.value.trim())p.set("barcode",barcode.value.trim());if(movement.value)p.set("movementType",movement.value);if(fromDate.value)p.set("fromDate",fromDate.value);if(toDate.value)p.set("toDate",toDate.value);return p.toString()}async function loadLedger(s=false){try{const d=await api(`/branch-analytics/movement-ledger?${qs()}`);const list=d.movements||[];rows.innerHTML=list.length?list.map(x=>`<div class="move"><div><span class="badge">${x.movement_type}</span> <strong>${x.barcode||"-"}</strong></div><div class="muted">${x.movement_at?new Date(x.movement_at).toLocaleString():"-"} | ${x.source_table||"-"} | Branch ${x.branch_id||"-"}</div><div>${x.product_name||""} ${x.transfer_no?`| ${x.transfer_no}`:""} ${x.invoice_number?`| ${x.invoice_number}`:""}</div></div>`).join(""):`<div class="muted">No movement found</div>`;if(s)toast("Ledger refreshed","success")}catch(e){toast(e.message,"error")}}function toggleSidebar(){sidebar?.classList.toggle("collapsed")}function logoutUser(){if(window.clearAuthSession)clearAuthSession();location.href="login.html"}addEventListener("DOMContentLoaded",loadLedger)</script><script src="js/toast.js"></script><script src="js/help-guide.js"></script></body></html>
